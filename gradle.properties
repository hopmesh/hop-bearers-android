org.gradle.jvmargs=-Xmx2048m
android.useAndroidX=true
kotlin.code.style=official

# The PUBLISHED version of the Hop Android SDK (`sh.hop:hop`) that every bearer declares as its
# dependency, and that the hop-sdk shim resolves against in the mirror build.
#
# This is deliberately NOT the bearers' own version. The two components version independently: the SDK
# is at 0.0.4 because its first three tags stranded (they were created before the release credentials
# were seeded, the publishes failed, mirror main moved on, and the tagger never retags), while the
# bearers are at 0.0.2 and have never been tagged. Deriving the dependency from the bearers' version, as
# the first cut did, would have published every bearer POM pointing at `sh.hop:hop:0.0.2`, a coordinate
# that does not exist on Maven Central and never will.
#
# It lives here because gradle.properties is inside the exported subtree, so the mirror build (where
# publishing actually runs) can read it without reaching outside its own repository.
#
# tools/version-align-guard.sh asserts this equals the version sdk/android declares, so it cannot drift.
hopSdkVersion=0.0.4
# AGP 9 defaults to two new behaviors this build deliberately opts OUT of, mirroring
# apps/android/HopDemo (the same modules compile under both builds, so the flags must agree):
#   - android.builtInKotlin: AGP 9 compiles Kotlin itself by default, which conflicts with the separate
#     org.jetbrains.kotlin.android plugin this build still applies (both register a `kotlin` extension).
#   - android.newDsl: AGP 9 defaults `android {}` to the new BaseExtension-free API; these build files
#     use the classic DSL, and the classic Kotlin plugin is not compatible with the new DSL either.
# Both are documented, supported opt-outs (removed in AGP 10, a future migration).
android.builtInKotlin=false
android.newDsl=false
